<!DOCTYPE html>
<html>
    <head>
        <title>forms</title>
    </head>
    <body>
        <h1>Registeration Form</h1>
        <form action="index.php" method="post" enctype="multipart/form-data">
            <label for="Username">Username:</label><br>
            <input type="text" id="Username" placeholder="spongebob" minlength="4" maxlength="10" ><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" minlength="8" maxlength="16" ><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" placeholder="abc1234@gmail.com"><br>
            <label for="phone:">Phone no:</label><br>
            <input type="tel" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>
            <label for="bday">Birthdate:</label><br>
            <input type="date" id="bday" ><br>
            <label for="quantity">Quantity:</label><br>
            <input type="number" id="quantity" min="0" max="99" value="1"><br>
            <p>Titles</p>
            <label for="mr">Mr.</label>
            <input type="radio" id="mr" value="Mr"name="title">
            <label for="ms">Ms.</label>
            <input type="radio" id="ms" value="Ms" name="title">
            <label for="doctor">Phd</label>
            <input type="radio" id="doctor" value="Phd" name="title"><br>
            <label for="subscribe">subscribe</label>
            <input type="checkbox"><br>
            <label for="payment">Payment:</label>
            <select id="payment">
                <option value="visa">Visa</option>
                <option value="mastercard">Mastercard</option>
                <option value="giftcard">Gift card</option>
            </select><br>
            <label for="comment">Comment:</label><br>
            <textarea id="comment" rows="5" cols="25"></textarea><br>
            <label for="file">File:</label>
            <input type="file" id="file" accept="image/png,image/jpeg"><br>
            <br><input type="submit"><br>
            <input type="reset">
            

        </form>
    </body>
</html>
